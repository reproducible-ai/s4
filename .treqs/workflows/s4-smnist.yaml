name: s4-smnist reproduction

# Generated by scaffold_row.py, then edited for this row (see NOTES below).
# Clean-DAG rules baked in: every step is a NAMED `roar run -n <name>`
# (trace:off, same-ABI); outputs live in git-tracked dirs (.gitkeep) with files
# gitignored; publish --no-tag.
#
# NOTES on the two deviations from the scaffold default:
#
#  1. roar is installed from the PUBLISHED TestPyPI index (0.4.4rc6), not from a
#     presigned S3 wheel, so this workflow needs no ROAR_WHEEL_URL secret. The
#     published wheel's sha256 is still asserted, because a version string is not
#     a build identity.
#
#  2. `--wandb-to-trackio` is deliberately NOT passed. Upstream's train.py does a
#     module-level `import wandb`, and PyTorch-Lightning's WandbLogger additionally
#     imports the `wandb.sdk.lib` and `wandb.wandb_run` SUBMODULES
#     (pytorch_lightning/loggers/wandb.py:35-41). The alias bridge serves the
#     top-level module only, so under the bridge that try-block raises
#     ModuleNotFoundError, PL sets `wandb = None`, and WandbLogger.__init__ dies at
#     wandb.py:305 before step 0 -- verified on CPU against 0.4.4rc6. Worse, with
#     the bridge active `import wandb` resolves to trackio, so the recorded freeze
#     would pin trackio and DROP wandb, which upstream genuinely requires. The
#     recipe is therefore run with upstream's own `wandb=null`, which is exactly
#     the form the upstream README documents.

secrets:
  - HF_TOKEN            # roar put upload

setup:
  command: |
    set -eu
    export PATH=/opt/pytorch/bin:$HOME/.local/bin:/root/.local/bin:/usr/local/bin:$PATH
    rm -rf *.egg-info src/*.egg-info
    id -un; echo "HOME=$HOME"; echo "PATH=$PATH"
    command -v python; python -V
    command -v uv || echo "uv: NOT ON PATH"

    # --- purge any pre-existing roar (P0-7: a bare `roar` has been caught
    # --- importing a leftover package dir and reporting the wrong version) ---
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    find / -xdev -name 'roar_inject.pth' 2>/dev/null || true

    # --- assert the identity of the published artifact, then install FROM THE INDEX ---
    curl -sSL -o /tmp/roar_cli-0.4.4rc6.whl \
      https://test-files.pythonhosted.org/packages/58/e9/04c6a8674eb29d065796060237ebfb07aa04567c45ce110b069c8a7dd2e1/roar_cli-0.4.4rc6-cp310-abi3-manylinux_2_34_x86_64.whl
    echo "c7115b748886259b6a089e547404376acf84c3b81b4cbc8dc5610490ebea7199  /tmp/roar_cli-0.4.4rc6.whl" | sha256sum -c -
    # `uv` is not guaranteed to be on this AMI's PATH (it was not, first attempt:
    # `/bin/bash: line 21: uv: command not found`), so fall back to a plain venv +
    # pip. Either way roar comes from the PUBLISHED TestPyPI index, under a 3.12
    # interpreter that matches the workload's (P0-14), in its OWN environment so
    # its dependency closure cannot leak into the recorded freeze.
    if command -v uv >/dev/null 2>&1; then
      uv tool install --python 3.12 --force --with huggingface-hub \
          --index-strategy unsafe-best-match \
          --extra-index-url https://test.pypi.org/simple/ \
          'roar-cli==0.4.4rc6'
      ROAR_BIN="$(ls -d "$HOME"/.local/bin/roar /root/.local/bin/roar 2>/dev/null | head -1)"
    else
      PY="$(command -v python)"
      sudo rm -rf /opt/roarenv
      sudo "$PY" -m venv /opt/roarenv
      sudo /opt/roarenv/bin/python -m pip install --quiet --upgrade pip
      # the sha256-verified artifact from the published index above; roar's own
      # deps come from PyPI only, so no TestPyPI name can shadow them
      sudo /opt/roarenv/bin/python -m pip install --quiet \
          --index-url https://pypi.org/simple \
          /tmp/roar_cli-0.4.4rc6.whl huggingface-hub
      ROAR_BIN=/opt/roarenv/bin/roar
    fi
    echo "roar binary: $ROAR_BIN"
    sudo ln -sf "$ROAR_BIN" /usr/local/bin/roar
    hash -r
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc6" || \
      { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    test "$(ls $(dirname $(readlink -f $(command -v roar)))/../lib/python*/site-packages/roar/bin | wc -l)" -ge 6 || \
      { echo "NO TRACER BINARIES"; exit 1; }

    # --- the s4 environment; see repro/requirements-lock.txt for why each pin is
    # --- what it is. The short version: torchtext 0.18.0 (an unavoidable
    # --- module-level import in src/dataloaders) links against libtorch 2.3, so the
    # --- whole torch stack goes back to 2.3.0 on this 2026 host.
    python -m pip install --quiet --no-input -r repro/requirements-lock.txt \
      || sudo -E env "PATH=$PATH" python -m pip install --quiet --no-input -r repro/requirements-lock.txt
    python -c "import torch;print('torch',torch.__version__,'cuda',torch.cuda.is_available())"
    if python -m pip list --format=freeze | grep -q '+'; then
      echo "LOCAL-VERSION PIN PRESENT (trap 2)"; python -m pip list --format=freeze | grep '+'; exit 1
    else
      echo "no local-version pins"
    fi

    # --- which native libs does the workload map, and does dpkg own them? ---
    python repro/native_libs.py

    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

train:
  command: |
    set -e
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    date -u +'TRAIN-STAGE-START %Y-%m-%dT%H:%M:%SZ'
    roar run -n train -- python -m train pipeline=mnist dataset.permute=True model=s4 model.n_layers=3 model.d_model=128 model.norm=batch model.prenorm=True wandb=null trainer.max_epochs=1 loader.num_workers=0 hydra.run.dir=./outputs/run
    date -u +'TRAIN-STAGE-END %Y-%m-%dT%H:%M:%SZ'
    echo '--- upstream metrics.csv (pytorch-lightning CSVLogger) ---'
    find outputs/run/lightning_logs -name metrics.csv -exec cat {} \; || true
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact outputs/run/checkpoints/val/accuracy.ckpt model.name=s4-smnist model.version=1 license.id=Apache-2.0 license.name='Apache License 2.0' description='S4 (structured state-space sequence model), 3 layers / d_model 128, trained on permuted sequential MNIST (784-step sequences)' documentation.url=https://github.com/state-spaces/s4/blob/main/README.md
  trace: off

publish:
  command: |
    set -e
    export PATH=/opt/pytorch/bin:$PATH
    ls -l outputs/run/checkpoints/val/accuracy.ckpt
    sha256sum outputs/run/checkpoints/val/accuracy.ckpt
    sha256sum outputs/run/checkpoints/last.ckpt || true
    roar put outputs/run/checkpoints/val/accuracy.ckpt hf://reproducible-ai/s4-smnist --public --yes --no-tag -m "S4 on permuted sequential MNIST — TRUNCATED: 1 of 200 epochs (configs/trainer/default.yaml), not converged"
  trace: off
